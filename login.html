<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page center-screen">
    <div class="card login-card">
      <div class="login-badge">🧺</div>
      <h1>55號洗衣店</h1>
      <p class="subtitle">營收記帳系統 · 請輸入密碼登入</p>
      <form id="login-form">
        <label for="password">密碼</label>
        <input type="password" id="password" required autocomplete="current-password" inputmode="numeric">
        <button type="submit" class="primary" id="submit-btn">登入</button>
        <p class="error-msg" id="error-msg"></p>
      </form>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const FAMILY_EMAIL = "linbooa@gmail.com";

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "entry.html";
    })();

    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "登入中...";

      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email: FAMILY_EMAIL, password });

      if (error) {
        errorMsg.textContent = "登入失敗,請確認帳號密碼是否正確";
        submitBtn.disabled = false;
        submitBtn.textContent = "登入";
        return;
      }

      window.location.href = "entry.html";
    });
  </script>
</body>
</html>
