<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>營收分析 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="page wide">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">📊</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">營收分析</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="entry.html">輸入營收</a>
          <a href="bulk-entry.html">批次補登</a>
          <a href="expense.html">支出</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div id="loading" class="loading">載入中...</div>

    <div id="content" style="display:none;">
      <div class="stat-grid">
        <div class="stat-card stat-card--week">
          <div class="stat-label">📅 本週營收</div>
          <div class="stat-value" id="stat-week">$0</div>
        </div>
        <div class="stat-card stat-card--month">
          <div class="stat-label">🗓️ 本月營收</div>
          <div class="stat-value" id="stat-month">$0</div>
        </div>
        <div class="stat-card stat-card--total">
          <div class="stat-label">💰 累計總營收</div>
          <div class="stat-value" id="stat-total">$0</div>
        </div>
        <div class="stat-card stat-card--avg">
          <div class="stat-label">📈 平均每筆金額</div>
          <div class="stat-value" id="stat-avg">$0</div>
        </div>
      </div>

      <div class="card">
        <p class="section-title">每週營收趨勢(洗衣機 / 烘衣機 / 總營收,全部紀錄)</p>
        <div class="chart-wrap">
          <canvas id="weekly-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <p class="section-title">近 6 個月營收趨勢</p>
        <div class="chart-wrap">
          <canvas id="monthly-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <p class="section-title">投幣機現鈔(不計入營收)</p>
        <p class="hint" style="margin-top:-4px;">投幣機現鈔不算店裡的營收,不會加進上面的統計數字,這裡單獨看它自己的金額。</p>
        <div class="stat-grid">
          <div class="stat-card stat-card--month">
            <div class="stat-label">🗓️ 投幣機現鈔本月</div>
            <div class="stat-value" id="stat-exchange-month">$0</div>
          </div>
          <div class="stat-card stat-card--total">
            <div class="stat-label">💰 投幣機現鈔累計</div>
            <div class="stat-value" id="stat-exchange-total">$0</div>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="exchange-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <p class="section-title">最近收款紀錄</p>
        <div id="entries-wrap">
          <table class="entries">
            <thead>
              <tr>
                <th>日期</th>
                <th>機台</th>
                <th>硬幣(10/50)</th>
                <th>紙鈔(100/500/1000)</th>
                <th style="text-align:right;">總計</th>
                <th>備注</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none;">還沒有任何收款紀錄</div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item active"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const DENOMS = [
      { key: "coin_10", value: 10 },
      { key: "coin_50", value: 50 },
      { key: "bill_100", value: 100 },
      { key: "bill_500", value: 500 },
      { key: "bill_1000", value: 1000 },
    ];

    // 投幣機現鈔不算店裡營收,統計和趨勢圖都要排除它
    const NON_REVENUE_MACHINES = ["exchange"];
    const WASH_MACHINES = ["wash_1", "wash_2", "wash_3", "wash_4", "wash_total"];
    const DRY_MACHINES = ["dry_1", "dry_2", "dry_3", "dry_total"];

    let allRows = [];
    let weeklyChart, monthlyChart, exchangeChart;

    (async () => {
      await requireSession();
      await loadData();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatMoney(n) {
      return "$" + Math.round(n).toLocaleString("zh-TW");
    }

    // 取得某日期所在那一週的星期一 (ISO 週)
    function weekStart(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      const day = d.getDay() || 7; // 週日算 7
      d.setDate(d.getDate() - day + 1);
      return formatLocalDate(d);
    }

    function monthStart(dateStr) {
      return dateStr.slice(0, 7); // YYYY-MM
    }

    function rowTotal(row) {
      if (row.manual_total != null) return row.manual_total;
      return row.coin_10 * 10 + row.coin_50 * 50 + row.bill_100 * 100 + row.bill_500 * 500 + row.bill_1000 * 1000;
    }

    async function loadData() {
      const { data, error } = await supabaseClient
        .from("collections")
        .select("*")
        .order("collected_at", { ascending: false });

      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      if (error) {
        document.getElementById("content").innerHTML = "<p class='error-msg'>載入失敗:" + error.message + "</p>";
        return;
      }

      allRows = data || [];
      renderStats();
      renderWeeklyChart();
      renderMonthlyChart();
      renderExchangeChart();
      renderTable();
    }

    function renderStats() {
      const revenueRows = allRows.filter((r) => !NON_REVENUE_MACHINES.includes(r.machine));
      const today = formatLocalDate(new Date());
      const thisWeek = weekStart(today);
      const thisMonth = monthStart(today);

      let weekTotal = 0, monthTotal = 0, grandTotal = 0;
      revenueRows.forEach((row) => {
        const t = rowTotal(row);
        grandTotal += t;
        if (weekStart(row.collected_at) === thisWeek) weekTotal += t;
        if (monthStart(row.collected_at) === thisMonth) monthTotal += t;
      });

      document.getElementById("stat-week").textContent = formatMoney(weekTotal);
      document.getElementById("stat-month").textContent = formatMoney(monthTotal);
      document.getElementById("stat-total").textContent = formatMoney(grandTotal);
      document.getElementById("stat-avg").textContent = revenueRows.length
        ? formatMoney(grandTotal / revenueRows.length)
        : "$0";

      const exchangeRows = allRows.filter((r) => NON_REVENUE_MACHINES.includes(r.machine));
      let exchangeMonthTotal = 0, exchangeGrandTotal = 0;
      exchangeRows.forEach((row) => {
        const t = rowTotal(row);
        exchangeGrandTotal += t;
        if (monthStart(row.collected_at) === thisMonth) exchangeMonthTotal += t;
      });
      document.getElementById("stat-exchange-month").textContent = formatMoney(exchangeMonthTotal);
      document.getElementById("stat-exchange-total").textContent = formatMoney(exchangeGrandTotal);
    }

    // 從最早一筆紀錄那一週開始,一路列到本週為止,每週一筆
    function allWeeksSoFar() {
      if (!allRows.length) return [weekStart(formatLocalDate(new Date()))];

      const earliest = allRows.reduce((min, r) => (r.collected_at < min ? r.collected_at : min), allRows[0].collected_at);
      const weeks = [];
      let cursor = new Date(weekStart(earliest) + "T00:00:00");
      const end = new Date(weekStart(formatLocalDate(new Date())) + "T00:00:00");

      while (cursor <= end) {
        weeks.push(formatLocalDate(cursor));
        cursor.setDate(cursor.getDate() + 7);
      }
      return weeks;
    }

    function lastNMonths(n) {
      const months = [];
      const d = new Date();
      for (let i = n - 1; i >= 0; i--) {
        const md = new Date(d.getFullYear(), d.getMonth() - i, 1);
        months.push(formatLocalDate(md).slice(0, 7));
      }
      return months;
    }

    function renderWeeklyChart() {
      const revenueRows = allRows.filter((r) => !NON_REVENUE_MACHINES.includes(r.machine));
      const washRows = revenueRows.filter((r) => WASH_MACHINES.includes(r.machine));
      const dryRows = revenueRows.filter((r) => DRY_MACHINES.includes(r.machine));
      const weeks = allWeeksSoFar();

      const sumFor = (rows, w) => rows.filter((r) => weekStart(r.collected_at) === w).reduce((sum, r) => sum + rowTotal(r), 0);
      const washTotals = weeks.map((w) => sumFor(washRows, w));
      const dryTotals = weeks.map((w) => sumFor(dryRows, w));
      const grandTotals = weeks.map((w) => sumFor(revenueRows, w));

      if (weeklyChart) weeklyChart.destroy();
      weeklyChart = new Chart(document.getElementById("weekly-chart"), {
        type: "line",
        data: {
          labels: weeks.map((w) => w.slice(5)),
          datasets: [
            {
              label: "洗衣機營收",
              data: washTotals,
              borderColor: "#2563eb",
              backgroundColor: "rgba(37,99,235,0.1)",
              fill: false,
              tension: 0.3,
              pointRadius: 3,
            },
            {
              label: "烘衣機營收",
              data: dryTotals,
              borderColor: "#d97706",
              backgroundColor: "rgba(217,119,6,0.1)",
              fill: false,
              tension: 0.3,
              pointRadius: 3,
            },
            {
              label: "總營收",
              data: grandTotals,
              borderColor: "#16a34a",
              backgroundColor: "rgba(22,163,74,0.1)",
              fill: false,
              tension: 0.3,
              pointRadius: 3,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: true } },
          scales: { y: { beginAtZero: true } },
        },
      });
    }

    function renderMonthlyChart() {
      const revenueRows = allRows.filter((r) => !NON_REVENUE_MACHINES.includes(r.machine));
      const months = lastNMonths(6);
      const totals = months.map((m) =>
        revenueRows.filter((r) => monthStart(r.collected_at) === m).reduce((sum, r) => sum + rowTotal(r), 0)
      );

      if (monthlyChart) monthlyChart.destroy();
      monthlyChart = new Chart(document.getElementById("monthly-chart"), {
        type: "line",
        data: {
          labels: months,
          datasets: [{
            label: "月營收",
            data: totals,
            borderColor: "#16a34a",
            backgroundColor: "rgba(22,163,74,0.1)",
            fill: true,
            tension: 0.3,
          }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } },
        },
      });
    }

    function renderExchangeChart() {
      const exchangeRows = allRows.filter((r) => NON_REVENUE_MACHINES.includes(r.machine));
      const weeks = allWeeksSoFar();
      const totals = weeks.map((w) =>
        exchangeRows.filter((r) => weekStart(r.collected_at) === w).reduce((sum, r) => sum + rowTotal(r), 0)
      );

      if (exchangeChart) exchangeChart.destroy();
      exchangeChart = new Chart(document.getElementById("exchange-chart"), {
        type: "line",
        data: {
          labels: weeks.map((w) => w.slice(5)),
          datasets: [{
            label: "投幣機現鈔",
            data: totals,
            borderColor: "#d97706",
            backgroundColor: "rgba(217,119,6,0.1)",
            fill: true,
            tension: 0.3,
            pointRadius: 3,
          }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } },
        },
      });
    }

    function renderTable() {
      const tbody = document.getElementById("entries-body");
      const emptyState = document.getElementById("empty-state");
      tbody.innerHTML = "";

      if (!allRows.length) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      allRows.slice(0, 30).forEach((row) => {
        const tr = document.createElement("tr");
        renderViewRow(tr, row);
        tbody.appendChild(tr);
      });
    }

    function renderViewRow(tr, row) {
      const machine = MACHINE_OPTIONS.find((m) => m.key === row.machine);
      const isManual = row.manual_total != null;
      const showCoin = !isManual && (!machine || machine.type === "coin" || machine.type === "mixed");
      const showBill = !isManual && (!machine || machine.type === "bill" || machine.type === "mixed");
      tr.innerHTML = `
        <td>${row.collected_at}</td>
        <td>${MACHINE_LABELS[row.machine] || row.machine}</td>
        <td>${showCoin ? `${row.coin_10} / ${row.coin_50}` : "-"}</td>
        <td>${showBill ? `${row.bill_100} / ${row.bill_500} / ${row.bill_1000}` : isManual ? "只有總額" : "-"}</td>
        <td class="amount">${formatMoney(rowTotal(row))}</td>
        <td>${escapeHtml(row.note) || "-"}</td>
        <td class="row-actions">
          <button class="icon-btn edit-btn">編輯</button>
          <button class="icon-btn danger delete-btn">刪除</button>
        </td>
      `;

      tr.querySelector(".edit-btn").addEventListener("click", () => renderEditRow(tr, row));
      tr.querySelector(".delete-btn").addEventListener("click", async () => {
        if (!confirm("確定要刪除這筆紀錄嗎?")) return;
        const { error } = await supabaseClient.from("collections").delete().eq("id", row.id);
        if (error) {
          alert("刪除失敗:" + error.message);
          return;
        }
        await loadData();
      });
    }

    function renderEditRow(tr, row) {
      const machine = MACHINE_OPTIONS.find((m) => m.key === row.machine);
      const isTotalMachine = row.manual_total != null || (!!machine && machine.type === "mixed");
      const showCoin = !isTotalMachine && (!machine || machine.type === "coin" || machine.type === "mixed");
      const showBill = !isTotalMachine && (!machine || machine.type === "bill" || machine.type === "mixed");

      const denomCells = isTotalMachine
        ? `<td colspan="2">
            <input type="number" min="0" step="1" class="edit-input edit-manual-total" value="${row.manual_total ?? ""}" placeholder="總金額(舊資料)">
          </td>`
        : `
          <td>${showCoin ? `
            <input type="number" min="0" step="1" class="edit-input edit-num" data-key="coin_10" value="${row.coin_10}">
            <input type="number" min="0" step="1" class="edit-input edit-num" data-key="coin_50" value="${row.coin_50}">
          ` : "-"}</td>
          <td>${showBill ? `
            <input type="number" min="0" step="1" class="edit-input edit-num" data-key="bill_100" value="${row.bill_100}">
            <input type="number" min="0" step="1" class="edit-input edit-num" data-key="bill_500" value="${row.bill_500}">
            <input type="number" min="0" step="1" class="edit-input edit-num" data-key="bill_1000" value="${row.bill_1000}">
          ` : "-"}</td>
        `;

      tr.innerHTML = `
        <td><input type="date" class="edit-input edit-date" value="${row.collected_at}"></td>
        <td>${MACHINE_LABELS[row.machine] || row.machine}</td>
        ${denomCells}
        <td class="amount edit-total">${formatMoney(rowTotal(row))}</td>
        <td><input type="text" class="edit-input edit-note" value="${escapeHtml(row.note)}"></td>
        <td class="row-actions">
          <button class="icon-btn save-btn">儲存</button>
          <button class="icon-btn cancel-btn">取消</button>
        </td>
      `;

      const totalCell = tr.querySelector(".edit-total");
      function recalcEditTotal() {
        if (isTotalMachine) {
          const manualInput = tr.querySelector(".edit-manual-total");
          totalCell.textContent = formatMoney(parseInt(manualInput.value, 10) || 0);
          return;
        }
        let total = 0;
        tr.querySelectorAll(".edit-num").forEach((input) => {
          const denom = DENOMS.find((d) => d.key === input.dataset.key).value;
          total += (parseInt(input.value, 10) || 0) * denom;
        });
        totalCell.textContent = formatMoney(total);
      }
      if (isTotalMachine) {
        tr.querySelector(".edit-manual-total").addEventListener("input", recalcEditTotal);
      } else {
        tr.querySelectorAll(".edit-num").forEach((input) => {
          input.addEventListener("input", recalcEditTotal);
        });
      }

      tr.querySelector(".cancel-btn").addEventListener("click", () => renderViewRow(tr, row));

      tr.querySelector(".save-btn").addEventListener("click", async () => {
        const collectedAt = tr.querySelector(".edit-date").value;
        if (!collectedAt) {
          alert("請選擇日期");
          return;
        }
        const noteVal = tr.querySelector(".edit-note").value.trim();
        const updates = { collected_at: collectedAt, note: noteVal || null };
        if (isTotalMachine) {
          const manualVal = parseInt(tr.querySelector(".edit-manual-total").value, 10);
          updates.manual_total = manualVal > 0 ? manualVal : null;
          DENOMS.forEach(({ key }) => { updates[key] = 0; });
        } else {
          tr.querySelectorAll(".edit-num").forEach((input) => {
            updates[input.dataset.key] = parseInt(input.value, 10) || 0;
          });
          updates.manual_total = null;
        }

        const saveBtn = tr.querySelector(".save-btn");
        saveBtn.disabled = true;
        saveBtn.textContent = "儲存中...";

        const { error } = await supabaseClient.from("collections").update(updates).eq("id", row.id);

        if (error) {
          alert("儲存失敗:" + error.message);
          saveBtn.disabled = false;
          saveBtn.textContent = "儲存";
          return;
        }

        await loadData();
      });
    }
  </script>
</body>
</html>
