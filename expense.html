<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>支出 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">💸</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">支出</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="entry.html">輸入營收</a>
          <a href="bulk-entry.html">批次補登</a>
          <a href="dashboard.html">看分析</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">新增一筆支出</p>
      <label for="expense-date">日期</label>
      <input type="date" id="expense-date">

      <label for="expense-item" style="margin-top:12px;">項目</label>
      <input type="text" id="expense-item" placeholder="例如:水電費、修機台、清潔用品">

      <label for="expense-amount" style="margin-top:12px;">金額</label>
      <input type="number" min="0" step="1" inputmode="numeric" id="expense-amount" placeholder="0">

      <button class="primary" id="submit-btn" style="margin-top:16px;">新增支出</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>

    <div class="card">
      <p class="section-title">支出紀錄</p>
      <div id="entries-wrap">
        <table class="entries">
          <thead>
            <tr>
              <th>日期</th>
              <th>項目</th>
              <th style="text-align:right;">金額</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expenses-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none;">還沒有任何支出紀錄</div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item active"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    (async () => {
      await requireSession();
      await loadExpenses();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);
    document.getElementById("expense-date").value = formatLocalDate(new Date());

    function formatMoney(n) {
      return "$" + Math.round(n).toLocaleString("zh-TW");
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const expenseDate = document.getElementById("expense-date").value;
      const item = document.getElementById("expense-item").value.trim();
      const amount = parseInt(document.getElementById("expense-amount").value, 10);

      if (!expenseDate) {
        errorMsg.textContent = "請選擇日期";
        return;
      }
      if (!item) {
        errorMsg.textContent = "請填項目";
        return;
      }
      if (!(amount > 0)) {
        errorMsg.textContent = "請填金額";
        return;
      }

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "新增中...";

      const { error } = await supabaseClient.from("expenses").insert({
        expense_date: expenseDate,
        item,
        amount,
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "新增支出";

      if (error) {
        errorMsg.textContent = "新增失敗:" + error.message;
        return;
      }

      successMsg.textContent = "已儲存!";
      document.getElementById("expense-item").value = "";
      document.getElementById("expense-amount").value = "";
      await loadExpenses();
    });

    async function loadExpenses() {
      const { data, error } = await supabaseClient
        .from("expenses")
        .select("*")
        .order("expense_date", { ascending: false })
        .order("created_at", { ascending: false });

      const tbody = document.getElementById("expenses-body");
      const emptyState = document.getElementById("empty-state");
      tbody.innerHTML = "";

      if (error) {
        document.getElementById("error-msg").textContent = "載入失敗:" + error.message;
        return;
      }

      const rows = data || [];
      if (!rows.length) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      rows.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.expense_date}</td>
          <td>${row.item}</td>
          <td class="amount" style="text-align:right;">${formatMoney(row.amount)}</td>
          <td class="row-actions">
            <button class="icon-btn danger delete-btn">刪除</button>
          </td>
        `;
        tr.querySelector(".delete-btn").addEventListener("click", async () => {
          if (!confirm("確定要刪除這筆支出嗎?")) return;
          const { error } = await supabaseClient.from("expenses").delete().eq("id", row.id);
          if (error) {
            alert("刪除失敗:" + error.message);
            return;
          }
          await loadExpenses();
        });
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
