<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>輸入營收 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">🧺</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">輸入營收</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="bulk-entry.html">批次補登</a>
          <a href="expense.html">支出</a>
          <a href="dashboard.html">看分析</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">收款日期</p>
      <input type="date" id="collected-at">
      <p class="hint" style="margin-top:8px;">依序填每台機器收到的總金額,填完按下面「送出這批收款」一次存檔。</p>
    </div>

    <div id="machines-wrap"></div>

    <div class="card">
      <div class="total-box">
        <span>本次收款總計</span>
        <span class="amount" id="total-amount">$0</span>
      </div>

      <label for="note">備註(選填)</label>
      <textarea id="note" rows="2" placeholder="例如:機台故障、特殊狀況..."></textarea>

      <button class="primary" id="submit-btn">送出這批收款</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item active"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const ALL_DENOMS = ["coin_10", "coin_50", "bill_100", "bill_500", "bill_1000"];

    // 每台洗衣機洗一次的價格,用來自動換算洗了幾次(烘衣機、投幣機沒有固定單價,不列在這裡)
    const PRICE_PER_WASH = {
      wash_1: 60,
      wash_2: 60,
      wash_3: 60,
      wash_4: 100,
    };

    // 投幣機現鈔:2026-06-01 起,除了總金額,額外記 1000/500 元各幾張,自動寫進備注
    const EXCHANGE_MACHINE_KEY = "exchange";
    const EXCHANGE_NOTE_START = "2026-06-01";

    (async () => {
      await requireSession();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);
    document.getElementById("collected-at").value = formatLocalDate(new Date());

    function formatMoney(n) {
      return "$" + n.toLocaleString("zh-TW");
    }

    const machinesWrap = document.getElementById("machines-wrap");

    MACHINES.forEach((machine) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.machine = machine.key;

      const price = PRICE_PER_WASH[machine.key];
      const isExchange = machine.key === EXCHANGE_MACHINE_KEY;

      card.innerHTML = `
        <div class="machine-header">
          <span class="section-title">${machine.label}</span>
        </div>
        ${price ? `<p class="hint machine-washes" style="margin:0 0 8px;">洗了 <strong>0</strong> 次(每次 $${price}）</p>` : ""}
        <input type="number" min="0" step="1" inputmode="numeric" class="machine-amount" placeholder="總金額">
        ${isExchange ? `
          <div class="denom-row" style="border:none; padding:8px 0 0; gap:8px;">
            <label style="flex:1;">1000 元
              <input type="number" min="0" step="1" inputmode="numeric" class="exchange-bill-1000" placeholder="幾張" value="0">
            </label>
            <label style="flex:1;">500 元
              <input type="number" min="0" step="1" inputmode="numeric" class="exchange-bill-500" placeholder="幾張" value="0">
            </label>
          </div>
        ` : ""}
      `;
      machinesWrap.appendChild(card);

      card.querySelector(".machine-amount").addEventListener("input", () => {
        recalcMachine(card);
        recalcGrandTotal();
      });
    });

    function recalcMachine(card) {
      const total = parseInt(card.querySelector(".machine-amount").value, 10) || 0;

      const price = PRICE_PER_WASH[card.dataset.machine];
      const washesEl = card.querySelector(".machine-washes strong");
      if (price && washesEl) {
        washesEl.textContent = Math.floor(total / price);
      }

      return total;
    }

    function recalcGrandTotal() {
      let grandTotal = 0;
      machinesWrap.querySelectorAll(".card").forEach((card) => {
        grandTotal += parseInt(card.querySelector(".machine-amount").value, 10) || 0;
      });
      document.getElementById("total-amount").textContent = formatMoney(grandTotal);
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const collectedAt = document.getElementById("collected-at").value;
      if (!collectedAt) {
        errorMsg.textContent = "請選擇收款日期";
        return;
      }

      const userNote = document.getElementById("note").value.trim();
      const showWashes = collectedAt >= "2026-03-01";
      const showExchangeNote = collectedAt >= EXCHANGE_NOTE_START;
      const rows = MACHINES.map((machine) => {
        const card = machinesWrap.querySelector(`[data-machine="${machine.key}"]`);
        const total = parseInt(card.querySelector(".machine-amount").value, 10) || 0;

        const price = PRICE_PER_WASH[machine.key];
        const washNote = showWashes && price ? `洗了 ${Math.floor(total / price)} 次` : null;

        const isExchange = machine.key === EXCHANGE_MACHINE_KEY;
        const bill1000 = isExchange ? parseInt(card.querySelector(".exchange-bill-1000").value, 10) || 0 : 0;
        const bill500 = isExchange ? parseInt(card.querySelector(".exchange-bill-500").value, 10) || 0 : 0;
        const exchangeNote = isExchange && showExchangeNote && (bill1000 || bill500)
          ? `1000元 ${bill1000}張、500元 ${bill500}張`
          : null;

        const note = [washNote, exchangeNote, userNote].filter(Boolean).join("；") || null;

        const row = { collected_at: collectedAt, machine: machine.key, note, manual_total: total };
        ALL_DENOMS.forEach((key) => { row[key] = 0; });
        if (isExchange) {
          row.bill_1000 = bill1000;
          row.bill_500 = bill500;
        }
        return row;
      });

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      const { error } = await supabaseClient.from("collections").insert(rows);

      submitBtn.disabled = false;
      submitBtn.textContent = "送出這批收款";

      if (error) {
        errorMsg.textContent = "送出失敗:" + error.message;
        return;
      }

      successMsg.textContent = "已儲存!可以繼續輸入下一批,或點上面「看分析」查看營收。";
      machinesWrap.querySelectorAll(".machine-amount").forEach((input) => {
        input.value = "";
      });
      machinesWrap.querySelectorAll(".exchange-bill-1000, .exchange-bill-500").forEach((input) => {
        input.value = "0";
      });
      machinesWrap.querySelectorAll(".card").forEach((card) => recalcMachine(card));
      recalcGrandTotal();
      document.getElementById("note").value = "";
    });
  </script>
</body>
</html>
