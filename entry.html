<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>輸入營收 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">🧺</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">輸入營收</span>
        </div>
      </div>
      <nav>
        <a href="bulk-entry.html">批次補登</a>
        <a href="dashboard.html">看分析</a>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">收款日期</p>
      <input type="date" id="collected-at">

      <p class="section-title" style="margin-top:20px;">硬幣 / 紙鈔數量</p>

      <div class="denom-row">
        <div class="label"><span class="coin-badge">10</span> 10 元硬幣</div>
        <input type="number" min="0" step="1" inputmode="numeric" id="coin_10" value="0">
        <div class="subtotal" id="sub_coin_10">$0</div>
      </div>
      <div class="denom-row">
        <div class="label"><span class="coin-badge">50</span> 50 元硬幣</div>
        <input type="number" min="0" step="1" inputmode="numeric" id="coin_50" value="0">
        <div class="subtotal" id="sub_coin_50">$0</div>
      </div>
      <div class="denom-row">
        <div class="label"><span class="coin-badge">100</span> 100 元紙鈔</div>
        <input type="number" min="0" step="1" inputmode="numeric" id="bill_100" value="0">
        <div class="subtotal" id="sub_bill_100">$0</div>
      </div>
      <div class="denom-row">
        <div class="label"><span class="coin-badge">500</span> 500 元紙鈔</div>
        <input type="number" min="0" step="1" inputmode="numeric" id="bill_500" value="0">
        <div class="subtotal" id="sub_bill_500">$0</div>
      </div>
      <div class="denom-row">
        <div class="label"><span class="coin-badge">1000</span> 1000 元紙鈔</div>
        <input type="number" min="0" step="1" inputmode="numeric" id="bill_1000" value="0">
        <div class="subtotal" id="sub_bill_1000">$0</div>
      </div>

      <div class="total-box">
        <span>總計</span>
        <span class="amount" id="total-amount">$0</span>
      </div>

      <label for="note">備註(選填)</label>
      <textarea id="note" rows="2" placeholder="例如:機台編號、特殊狀況..."></textarea>

      <button class="primary" id="submit-btn">送出這筆記錄</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const DENOMS = [
      { key: "coin_10", value: 10 },
      { key: "coin_50", value: 50 },
      { key: "bill_100", value: 100 },
      { key: "bill_500", value: 500 },
      { key: "bill_1000", value: 1000 },
    ];

    (async () => {
      await requireSession();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);
    document.getElementById("collected-at").value = formatLocalDate(new Date());

    function formatMoney(n) {
      return "$" + n.toLocaleString("zh-TW");
    }

    function recalc() {
      let total = 0;
      DENOMS.forEach(({ key, value }) => {
        const count = parseInt(document.getElementById(key).value, 10) || 0;
        const subtotal = count * value;
        total += subtotal;
        document.getElementById("sub_" + key).textContent = formatMoney(subtotal);
      });
      document.getElementById("total-amount").textContent = formatMoney(total);
      return total;
    }

    DENOMS.forEach(({ key }) => {
      document.getElementById(key).addEventListener("input", recalc);
    });
    recalc();

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const collectedAt = document.getElementById("collected-at").value;
      if (!collectedAt) {
        errorMsg.textContent = "請選擇收款日期";
        return;
      }

      const row = { collected_at: collectedAt, note: document.getElementById("note").value.trim() || null };
      DENOMS.forEach(({ key }) => {
        row[key] = parseInt(document.getElementById(key).value, 10) || 0;
      });

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      const { error } = await supabaseClient.from("collections").insert(row);

      submitBtn.disabled = false;
      submitBtn.textContent = "送出這筆記錄";

      if (error) {
        errorMsg.textContent = "送出失敗:" + error.message;
        return;
      }

      successMsg.textContent = "已儲存!可以繼續輸入下一筆,或點上面「看分析」查看營收。";
      DENOMS.forEach(({ key }) => {
        document.getElementById(key).value = 0;
      });
      document.getElementById("note").value = "";
      recalc();
    });
  </script>
</body>
</html>
