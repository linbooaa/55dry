<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>輸入營收 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">🧺</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">輸入營收</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="bulk-entry.html">批次補登</a>
          <a href="expense.html">支出</a>
          <a href="dashboard.html">看分析</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">收款日期</p>
      <input type="date" id="collected-at">
      <p class="hint" style="margin-top:8px;">依序點收每台機器的硬幣/紙鈔數量,填完按下面「送出這批收款」一次存檔。</p>
    </div>

    <div id="machines-wrap"></div>

    <div class="card">
      <div class="total-box">
        <span>本次收款總計</span>
        <span class="amount" id="total-amount">$0</span>
      </div>

      <label for="note">備註(選填)</label>
      <textarea id="note" rows="2" placeholder="例如:機台故障、特殊狀況..."></textarea>

      <button class="primary" id="submit-btn">送出這批收款</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item active"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const COIN_DENOMS = [
      { key: "coin_10", value: 10, label: "10 元硬幣" },
      { key: "coin_50", value: 50, label: "50 元硬幣" },
    ];
    const BILL_DENOMS = [
      { key: "bill_100", value: 100, label: "100 元紙鈔" },
      { key: "bill_500", value: 500, label: "500 元紙鈔" },
      { key: "bill_1000", value: 1000, label: "1000 元紙鈔" },
    ];
    const ALL_DENOMS = [...COIN_DENOMS, ...BILL_DENOMS];

    (async () => {
      await requireSession();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);
    document.getElementById("collected-at").value = formatLocalDate(new Date());

    function formatMoney(n) {
      return "$" + n.toLocaleString("zh-TW");
    }

    const machinesWrap = document.getElementById("machines-wrap");

    MACHINES.forEach((machine) => {
      const denoms = machine.type === "coin" ? COIN_DENOMS : BILL_DENOMS;
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.machine = machine.key;

      const rows = denoms.map(({ key, value, label }) => `
        <div class="denom-row">
          <div class="label"><span class="coin-badge">${value}</span> ${label}</div>
          <div class="stepper">
            <button type="button" class="stepper-btn stepper-minus" data-key="${key}" aria-label="減少一個${label}">−</button>
            <input type="number" min="0" step="1" inputmode="numeric" class="denom-input" data-key="${key}" value="0">
            <button type="button" class="stepper-btn stepper-plus" data-key="${key}" aria-label="增加一個${label}">+</button>
          </div>
          <div class="subtotal" data-sub="${key}">$0</div>
        </div>
      `).join("");

      card.innerHTML = `
        <div class="machine-header">
          <span class="section-title">${machine.label}</span>
          <span class="amount machine-total">$0</span>
        </div>
        ${rows}
      `;
      machinesWrap.appendChild(card);

      card.querySelectorAll(".denom-input").forEach((input) => {
        input.addEventListener("input", () => {
          recalcMachine(card, denoms);
          recalcGrandTotal();
        });
      });

      card.querySelectorAll(".stepper-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.key;
          const input = card.querySelector(`.denom-input[data-key="${key}"]`);
          const delta = btn.classList.contains("stepper-plus") ? 1 : -1;
          input.value = Math.max(0, (parseInt(input.value, 10) || 0) + delta);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
      });
    });

    function recalcMachine(card, denoms) {
      let total = 0;
      denoms.forEach(({ key, value }) => {
        const count = parseInt(card.querySelector(`.denom-input[data-key="${key}"]`).value, 10) || 0;
        const subtotal = count * value;
        total += subtotal;
        card.querySelector(`[data-sub="${key}"]`).textContent = formatMoney(subtotal);
      });
      card.querySelector(".machine-total").textContent = formatMoney(total);
      return total;
    }

    function recalcGrandTotal() {
      let grandTotal = 0;
      machinesWrap.querySelectorAll(".card").forEach((card) => {
        const machine = MACHINES.find((m) => m.key === card.dataset.machine);
        const denoms = machine.type === "coin" ? COIN_DENOMS : BILL_DENOMS;
        let total = 0;
        denoms.forEach(({ key, value }) => {
          const count = parseInt(card.querySelector(`.denom-input[data-key="${key}"]`).value, 10) || 0;
          total += count * value;
        });
        grandTotal += total;
      });
      document.getElementById("total-amount").textContent = formatMoney(grandTotal);
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const collectedAt = document.getElementById("collected-at").value;
      if (!collectedAt) {
        errorMsg.textContent = "請選擇收款日期";
        return;
      }

      const note = document.getElementById("note").value.trim() || null;
      const rows = MACHINES.map((machine) => {
        const card = machinesWrap.querySelector(`[data-machine="${machine.key}"]`);
        const row = { collected_at: collectedAt, machine: machine.key, note };
        ALL_DENOMS.forEach(({ key }) => {
          const input = card.querySelector(`.denom-input[data-key="${key}"]`);
          row[key] = input ? parseInt(input.value, 10) || 0 : 0;
        });
        return row;
      });

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      const { error } = await supabaseClient.from("collections").insert(rows);

      submitBtn.disabled = false;
      submitBtn.textContent = "送出這批收款";

      if (error) {
        errorMsg.textContent = "送出失敗:" + error.message;
        return;
      }

      successMsg.textContent = "已儲存!可以繼續輸入下一批,或點上面「看分析」查看營收。";
      machinesWrap.querySelectorAll(".denom-input").forEach((input) => {
        input.value = 0;
      });
      machinesWrap.querySelectorAll(".card").forEach((card) => {
        const machine = MACHINES.find((m) => m.key === card.dataset.machine);
        const denoms = machine.type === "coin" ? COIN_DENOMS : BILL_DENOMS;
        recalcMachine(card, denoms);
      });
      recalcGrandTotal();
      document.getElementById("note").value = "";
    });
  </script>
</body>
</html>
