<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>批次補登 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page wide">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">📝</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">批次補登</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="entry.html">輸入營收</a>
          <a href="expense.html">支出</a>
          <a href="dashboard.html">看分析</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">一次補登多筆過去的記錄</p>
      <p class="hint">適合把記帳本上的舊資料一次打完:每一列填一天的日期、機台跟總金額,打完按「送出全部」一次存檔。空白的列會自動略過。如果舊資料沒有分機台,機台選「總收入(舊資料,無機台明細)」。機台選「投幣機現鈔」時,可以額外填 1000/500 元各幾張,會自動寫進備註。</p>

      <div class="bulk-table-wrap">
        <table class="entries bulk-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>機台</th>
              <th>總金額</th>
              <th>1000元(張)</th>
              <th>500元(張)</th>
              <th>備註</th>
              <th style="text-align:right;">總計</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bulk-body"></tbody>
        </table>
      </div>

      <button type="button" class="icon-btn" id="add-row-btn">+ 新增一列</button>

      <button class="primary" id="submit-all-btn">送出全部</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item active"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const EMPTY_ROW_COUNT = 10;
    const EXCHANGE_MACHINE_KEY = "exchange";
    const ALL_DENOMS = ["coin_10", "coin_50", "bill_100", "bill_500", "bill_1000"];

    (async () => {
      await requireSession();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);

    const tbody = document.getElementById("bulk-body");

    function formatMoney(n) {
      return "$" + n.toLocaleString("zh-TW");
    }

    function addRow() {
      const tr = document.createElement("tr");
      const machineOptions = MACHINE_OPTIONS.map((m) => `<option value="${m.key}">${m.label}</option>`).join("");
      tr.innerHTML = `
        <td><input type="date" class="row-date"></td>
        <td>
          <select class="row-machine">
            <option value="">請選擇</option>
            ${machineOptions}
          </select>
        </td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-total-input" placeholder="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-bill-1000" value="0" disabled></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-bill-500" value="0" disabled></td>
        <td><input type="text" class="row-note" placeholder="選填"></td>
        <td class="amount row-total" style="text-align:right;">$0</td>
        <td><button type="button" class="icon-btn danger row-remove">移除</button></td>
      `;
      tbody.appendChild(tr);

      tr.querySelector(".row-total-input").addEventListener("input", () => recalcRow(tr));
      tr.querySelector(".row-machine").addEventListener("change", () => updateRowMachineType(tr));
      tr.querySelector(".row-remove").addEventListener("click", () => tr.remove());
    }

    function updateRowMachineType(tr) {
      const machineKey = tr.querySelector(".row-machine").value;
      const isExchange = machineKey === EXCHANGE_MACHINE_KEY;

      const bill1000Input = tr.querySelector(".row-bill-1000");
      const bill500Input = tr.querySelector(".row-bill-500");
      bill1000Input.disabled = !isExchange;
      bill500Input.disabled = !isExchange;
      if (!isExchange) {
        bill1000Input.value = 0;
        bill500Input.value = 0;
      }
    }

    function recalcRow(tr) {
      const total = parseInt(tr.querySelector(".row-total-input").value, 10) || 0;
      tr.querySelector(".row-total").textContent = formatMoney(total);
    }

    document.getElementById("add-row-btn").addEventListener("click", addRow);

    for (let i = 0; i < EMPTY_ROW_COUNT; i++) addRow();

    document.getElementById("submit-all-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const rows = [];
      let hasInvalid = false;

      tbody.querySelectorAll("tr").forEach((tr) => {
        const date = tr.querySelector(".row-date").value;
        const machine = tr.querySelector(".row-machine").value;
        const total = parseInt(tr.querySelector(".row-total-input").value, 10) || 0;
        const userNote = tr.querySelector(".row-note").value.trim();

        if (!date && !machine && total === 0 && !userNote) return; // 完全空白的列,自動略過
        if (!date || !machine) {
          hasInvalid = true;
          return;
        }

        const isExchange = machine === EXCHANGE_MACHINE_KEY;
        const bill1000 = isExchange ? parseInt(tr.querySelector(".row-bill-1000").value, 10) || 0 : 0;
        const bill500 = isExchange ? parseInt(tr.querySelector(".row-bill-500").value, 10) || 0 : 0;
        const exchangeNote = isExchange && (bill1000 || bill500)
          ? `1000元 ${bill1000}張、500元 ${bill500}張`
          : null;
        const note = [exchangeNote, userNote].filter(Boolean).join("；") || null;

        const row = { collected_at: date, machine, note, manual_total: total };
        ALL_DENOMS.forEach((key) => { row[key] = 0; });
        if (isExchange) {
          row.bill_1000 = bill1000;
          row.bill_500 = bill500;
        }
        rows.push(row);
      });

      if (hasInvalid) {
        errorMsg.textContent = "有幾列填了資料卻沒選日期或機台,請補齊(或把金額清空)";
        return;
      }
      if (!rows.length) {
        errorMsg.textContent = "沒有可以送出的資料,請至少填一列";
        return;
      }

      const submitBtn = document.getElementById("submit-all-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      const { error } = await supabaseClient.from("collections").insert(rows);

      submitBtn.disabled = false;
      submitBtn.textContent = "送出全部";

      if (error) {
        errorMsg.textContent = "送出失敗:" + error.message;
        return;
      }

      successMsg.textContent = `已成功存入 ${rows.length} 筆記錄!`;
      tbody.innerHTML = "";
      for (let i = 0; i < EMPTY_ROW_COUNT; i++) addRow();
    });
  </script>
</body>
</html>
