<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>批次補登 | 55號洗衣店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="manifest" href="assets/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="55號洗衣店">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page wide">
    <div class="topbar">
      <div class="brand">
        <span class="brand-badge">📝</span>
        <div class="brand-text">
          <span class="brand-name">55號洗衣店</span>
          <span class="brand-sub">批次補登</span>
        </div>
      </div>
      <nav>
        <span class="nav-links">
          <a href="entry.html">輸入營收</a>
          <a href="expense.html">支出</a>
          <a href="dashboard.html">看分析</a>
        </span>
        <button class="signout" id="signout-btn">登出</button>
      </nav>
    </div>

    <div class="card">
      <p class="section-title">一次補登多筆過去的記錄</p>
      <p class="hint">適合把記帳本上的舊資料一次打完:每一列填一天的日期、機台跟面額數量,打完按「送出全部」一次存檔。空白的列會自動略過。如果舊資料沒有分機台,機台選「總收入(舊資料,無機台明細)」,硬幣紙鈔都可以填;如果連面額都不知道、只記得當天總共收多少,可以直接填最右邊的「總金額」欄位就好。</p>

      <div class="bulk-table-wrap">
        <table class="entries bulk-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>機台</th>
              <th>10 元硬幣</th>
              <th>50 元硬幣</th>
              <th>100 元紙鈔</th>
              <th>500 元紙鈔</th>
              <th>1000 元紙鈔</th>
              <th>總金額(舊資料)</th>
              <th>備註</th>
              <th style="text-align:right;">總計</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bulk-body"></tbody>
        </table>
      </div>

      <button type="button" class="icon-btn" id="add-row-btn">+ 新增一列</button>

      <button class="primary" id="submit-all-btn">送出全部</button>
      <p class="error-msg" id="error-msg"></p>
      <p class="success-msg" id="success-msg"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="entry.html" class="bottom-nav-item"><span class="bn-icon">🧺</span><span class="bn-label">輸入營收</span></a>
    <a href="bulk-entry.html" class="bottom-nav-item active"><span class="bn-icon">📝</span><span class="bn-label">批次補登</span></a>
    <a href="expense.html" class="bottom-nav-item"><span class="bn-icon">💸</span><span class="bn-label">支出</span></a>
    <a href="dashboard.html" class="bottom-nav-item"><span class="bn-icon">📊</span><span class="bn-label">看分析</span></a>
  </nav>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    const DENOMS = [
      { key: "coin_10", value: 10, type: "coin" },
      { key: "coin_50", value: 50, type: "coin" },
      { key: "bill_100", value: 100, type: "bill" },
      { key: "bill_500", value: 500, type: "bill" },
      { key: "bill_1000", value: 1000, type: "bill" },
    ];
    const EMPTY_ROW_COUNT = 10;

    (async () => {
      await requireSession();
    })();

    document.getElementById("signout-btn").addEventListener("click", signOut);

    const tbody = document.getElementById("bulk-body");

    function formatMoney(n) {
      return "$" + n.toLocaleString("zh-TW");
    }

    function addRow() {
      const tr = document.createElement("tr");
      const machineOptions = MACHINE_OPTIONS.map((m) => `<option value="${m.key}">${m.label}</option>`).join("");
      tr.innerHTML = `
        <td><input type="date" class="row-date"></td>
        <td>
          <select class="row-machine">
            <option value="">請選擇</option>
            ${machineOptions}
          </select>
        </td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-input" data-key="coin_10" value="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-input" data-key="coin_50" value="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-input" data-key="bill_100" value="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-input" data-key="bill_500" value="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-input" data-key="bill_1000" value="0"></td>
        <td><input type="number" min="0" step="1" inputmode="numeric" class="row-manual-total" placeholder="只知道總額時填" disabled></td>
        <td><input type="text" class="row-note" placeholder="選填"></td>
        <td class="amount row-total" style="text-align:right;">$0</td>
        <td><button type="button" class="icon-btn danger row-remove">移除</button></td>
      `;
      tbody.appendChild(tr);

      tr.querySelectorAll(".row-input").forEach((input) => {
        input.addEventListener("input", () => recalcRow(tr));
      });
      tr.querySelector(".row-manual-total").addEventListener("input", () => updateRowMachineType(tr));
      tr.querySelector(".row-machine").addEventListener("change", () => updateRowMachineType(tr));
      tr.querySelector(".row-remove").addEventListener("click", () => tr.remove());
    }

    function manualTotalValue(tr) {
      const manualInput = tr.querySelector(".row-manual-total");
      if (manualInput.disabled) return null;
      const n = parseInt(manualInput.value, 10);
      return n > 0 ? n : null;
    }

    function updateRowMachineType(tr) {
      const machineKey = tr.querySelector(".row-machine").value;
      const machine = MACHINE_OPTIONS.find((m) => m.key === machineKey);
      const isTotal = !!machine && machine.type === "mixed";

      const manualInput = tr.querySelector(".row-manual-total");
      manualInput.disabled = !isTotal;
      if (!isTotal) manualInput.value = "";

      const usingManual = manualTotalValue(tr) !== null;

      DENOMS.forEach(({ key, type }) => {
        const input = tr.querySelector(`.row-input[data-key="${key}"]`);
        const typeDisabled = machine && machine.type !== "mixed" ? machine.type !== type : false;
        const disabled = typeDisabled || usingManual;
        input.disabled = disabled;
        if (disabled) input.value = 0;
      });
      recalcRow(tr);
    }

    function recalcRow(tr) {
      const manual = manualTotalValue(tr);
      let total;
      if (manual !== null) {
        total = manual;
      } else {
        total = 0;
        DENOMS.forEach(({ key, value }) => {
          const count = parseInt(tr.querySelector(`.row-input[data-key="${key}"]`).value, 10) || 0;
          total += count * value;
        });
      }
      tr.querySelector(".row-total").textContent = formatMoney(total);
    }

    document.getElementById("add-row-btn").addEventListener("click", addRow);

    for (let i = 0; i < EMPTY_ROW_COUNT; i++) addRow();

    document.getElementById("submit-all-btn").addEventListener("click", async () => {
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");
      errorMsg.textContent = "";
      successMsg.textContent = "";

      const rows = [];
      let hasInvalid = false;

      tbody.querySelectorAll("tr").forEach((tr) => {
        const date = tr.querySelector(".row-date").value;
        const machine = tr.querySelector(".row-machine").value;
        const manualTotal = manualTotalValue(tr);
        const counts = {};
        let rowTotal = 0;
        DENOMS.forEach(({ key, value }) => {
          const count = manualTotal !== null ? 0 : (parseInt(tr.querySelector(`.row-input[data-key="${key}"]`).value, 10) || 0);
          counts[key] = count;
          rowTotal += count * value;
        });
        if (manualTotal !== null) rowTotal = manualTotal;
        const note = tr.querySelector(".row-note").value.trim();

        if (!date && !machine && rowTotal === 0) return; // 完全空白的列,自動略過
        if (!date || !machine) {
          hasInvalid = true;
          return;
        }

        rows.push({ collected_at: date, machine, note: note || null, manual_total: manualTotal, ...counts });
      });

      if (hasInvalid) {
        errorMsg.textContent = "有幾列填了資料卻沒選日期或機台,請補齊(或把金額清空)";
        return;
      }
      if (!rows.length) {
        errorMsg.textContent = "沒有可以送出的資料,請至少填一列";
        return;
      }

      const submitBtn = document.getElementById("submit-all-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "送出中...";

      const { error } = await supabaseClient.from("collections").insert(rows);

      submitBtn.disabled = false;
      submitBtn.textContent = "送出全部";

      if (error) {
        errorMsg.textContent = "送出失敗:" + error.message;
        return;
      }

      successMsg.textContent = `已成功存入 ${rows.length} 筆記錄!`;
      tbody.innerHTML = "";
      for (let i = 0; i < EMPTY_ROW_COUNT; i++) addRow();
    });
  </script>
</body>
</html>
